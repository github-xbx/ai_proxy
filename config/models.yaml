server:
  port: 3000
  host: localhost

logging:
  level: info
  console: true
  file: true
  logDir: ./logs
  filePattern: ai-proxy-%DATE%.log
  retentionDays: 7

routes:
  claude-sonnet-4-5:
    targetModel: deepseek-v4-pro[1m]
    protocol: anthropic
    baseUrl: https://api.deepseek.com/anthropic
    apiKey: ${DEEPSEEK_API_KEY}
    streaming: true

  claude-3-opus-20240229:
    targetModel: deepseek-reasoner
    protocol: anthropic
    baseUrl: https://api.deepseek.com/anthropic
    apiKey: ${DEEPSEEK_API_KEY}
    streaming: true

  claude-sonnet-4-6:
    targetModel: mimo-v2.5-pro
    protocol: anthropic
    baseUrl: https://token-plan-cn.xiaomimimo.com/anthropic
    apiKey: ${MIMO_API_KEY}
    streaming: true
